[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --ignore=tests/integration
markers =
    integration: mark test as integration test (requires data and model)
    slow: mark test as slow running
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
